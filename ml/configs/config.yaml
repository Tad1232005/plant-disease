# Cấu hình ML — đường dẫn và hyperparameter
# Mọi script đọc file này; chạy từ repo root hoặc thư mục ml/ đều được.

paths:
  filtered_dir: data/filtered      # Data gốc — 38 class sau bước tải từ HF
  split_dir: data/split            # Lọc class + chia train/val/test
  metadata_dir: data/metadata      # leaf-map.json (gitignore qua ml/data/)
  models_dir: models               # best_model.pt, classes.json
  outputs_dir: outputs             # logs, figures

huggingface:
  dataset_name: mohanty/PlantVillage
  variant: color        # raw/color/ trong data.zip — ảnh RGB gốc (~54k)

# 38 class PlantVillage — chỉnh/bớt nếu scope đồ án thay đổi
target_classes:
  - Apple___Apple_scab
  - Apple___Black_rot
  - Apple___Cedar_apple_rust
  - Apple___healthy
  - Blueberry___healthy
  - Cherry_(including_sour)___Powdery_mildew
  - Cherry_(including_sour)___healthy
  - Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot
  - Corn_(maize)___Common_rust_
  - Corn_(maize)___Northern_Leaf_Blight
  - Corn_(maize)___healthy
  - Grape___Black_rot
  - Grape___Esca_(Black_Measles)
  - Grape___Leaf_blight_(Isariopsis_Leaf_Spot)
  - Grape___healthy
  - Orange___Haunglongbing_(Citrus_greening)
  - Peach___Bacterial_spot
  - Peach___healthy
  - Pepper,_bell___Bacterial_spot
  - Pepper,_bell___healthy
  - Potato___Early_blight
  - Potato___Late_blight
  - Potato___healthy
  - Raspberry___healthy
  - Soybean___healthy
  - Squash___Powdery_mildew
  - Strawberry___Leaf_scorch
  - Strawberry___healthy
  - Tomato___Bacterial_spot
  - Tomato___Early_blight
  - Tomato___Late_blight
  - Tomato___Leaf_Mold
  - Tomato___Septoria_leaf_spot
  - Tomato___Spider_mites Two-spotted_spider_mite
  - Tomato___Target_Spot
  - Tomato___Tomato_Yellow_Leaf_Curl_Virus
  - Tomato___Tomato_mosaic_virus
  - Tomato___healthy

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

train:
  batch_size: 32
  epochs: 15
  lr: 0.0001
  image_size: 224
  num_workers: 2
