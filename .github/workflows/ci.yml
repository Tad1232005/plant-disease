# CI tối thiểu cho flow feature/* -> dev -> main.
# Add 3 checks này vào required status checks của ruleset dev + main:
#   backend-test / frontend-build / admin-build
# ML không chạy ở CI (nặng, cần data + GPU); BE test đã mock inference.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plant_app
          POSTGRES_PASSWORD: plant_test_password
          POSTGRES_DB: plant_disease
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U plant_app -d plant_disease"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest (PostgreSQL service on 55432)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          POSTGRES_DB: plant_disease
          POSTGRES_USER: plant_app
          POSTGRES_PASSWORD: plant_test_password
          SECRET_KEY: ci-test-secret-key-32-bytes-long-ok
        run: python -m pytest tests/ -q

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  admin-build:
    name: admin-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
